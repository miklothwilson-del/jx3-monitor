name: JX3 Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check character status
        run: python monitor.py
        env:
          ROLE_NAME: ${{ secrets.ROLE_NAME }}
          ROLE_SERVER: ${{ secrets.ROLE_SERVER }}
